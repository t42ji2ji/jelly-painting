<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5f0" />
    <title>Jelly Painting · Model</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-page="model">
    <canvas class="scene" aria-label="A dropped 3D model painted on paper. Drag it to slide and wobble it, S to shake, drag elsewhere to orbit."></canvas>
    <div class="drop">把 .glb / .gltf 拖進來<label>或選檔案<input type="file" accept=".glb,.gltf" /></label></div>
    <nav class="themes" aria-label="Theme"><a href="./">果凍杯</a></nav>
    <script type="module">
      import '/src/loader.js';
      import('/src/model.js').catch((e) => {
        console.error(e);
        document.body.insertAdjacentHTML('beforeend', '<div class="fail">這個瀏覽器跑不起 WebGPU 場景。</div>');
      });
    </script>
  </body>
</html>

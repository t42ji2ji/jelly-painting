<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5f0" />
    <title>Jelly Painting</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f7f5f0; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
      body.can-grab canvas { cursor: grab; }
      body.grabbing canvas { cursor: grabbing; }
      .themes { position: fixed; left: 50%; bottom: max(6px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 18px; }
      .themes button { font: 700 17px/1 cursive; color: #7d6757; background: none; border: 0; padding: 6px 4px; cursor: pointer; opacity: 0.5; }
      .themes button[aria-pressed='true'] { opacity: 1; }
      .fail { position: fixed; inset: 0; display: grid; place-items: center; font: 700 19px/1.4 cursive; color: #7d6757; padding: 16px; text-align: center; }
    </style>
  </head>
  <body>
    <canvas aria-label="A painted dessert cup with a wobbling jelly. Drag the cup to slide it, S to shake, drag elsewhere to orbit."></canvas>
    <nav class="themes" aria-label="Theme"></nav>
    <script type="module">
      import('/src/main.js').catch((e) => {
        console.error(e);
        document.body.insertAdjacentHTML('beforeend', '<div class="fail">這個瀏覽器跑不起 WebGPU 場景。</div>');
      });
    </script>
  </body>
</html>

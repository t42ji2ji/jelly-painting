<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f5f0" />
    <title>Jelly Painting</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas class="scene" aria-label="A painted dessert cup with a wobbling jelly, or a dropped 3D model. Drag the subject to slide and wobble it, S to shake, drag elsewhere to orbit."></canvas>
    <div class="swatches" aria-label="Backdrop"></div>
    <button class="add big" aria-label="加入模型"><span>.glb / .gltf</span></button>
    <button class="add small" aria-label="換一個模型"></button>
    <input class="file" type="file" accept=".glb,.gltf" hidden />
    <nav class="modes"><button data-mode="cup">果凍杯</button><button data-mode="model">模型</button></nav>
    <script type="module">
      import '/src/loader.js';
      import('/src/main.js').catch((e) => {
        console.error(e);
        document.body.insertAdjacentHTML('beforeend', '<div class="fail">這個瀏覽器跑不起 WebGPU 場景。</div>');
      });
    </script>
  </body>
</html>
